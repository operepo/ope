    ope-dns:
        build: ./ope-dns
        image: operepo/ope-dns:release
        container_name: ope-dns
        restart: always
        network_mode: <NETWORK_MODE>
        cap_add:
            - NET_ADMIN
        # --local-service - only do response from local network?
        #--local /thisdomain.com/192.168.1.1 - Forward these specific domains here  
        command: " --filterwin2k --stop-dns-rebind --dns-forward-max=0 --dns-loop-detect --bogus-priv --domain-needed --no-hosts --no-resolv -A /<DOMAIN>/<IP> --local=/<DOMAIN>/ --txt-record=_acme-challenge.<DOMAIN>,<ACME_AUTH_CODE> <DNS_EXTRAS> " 
        # --local=/<DOMAIN>/ - dnsmasq 2.86+ only applies -A to A queries; this keeps answering other types (AAAA, MX...)
        #   for <DOMAIN> locally with an empty NOERROR like 2.80 did, instead of REFUSED (there are no upstream servers)
        # --server=127.1.1.1 - shouldn't need if no-resolv is on
        # --auth-server=<DOMAIN>  - caused error on older container?
        #--log-queries 
        #--log-facility=-"
        # --log-facility=-
        ports:
            - "53:53/tcp"
            - "53:53/udp"
        env_file: .env
        #depends_on:
        #    - ope-router
        environment:
            - IP_ADDR=<IP>
